datadir=/home/bitcoin/.bitcoin

# RPC (user and password are passed on the command line from .env)
rpcbind=0.0.0.0
rpcport=8332
rpcallowip=172.16.0.0/12

server=1

# P2P
bind=0.0.0.0:8333

fallbackfee=0.0001

# Never reach the public Bitcoin DNS seeds, this is a private network.
dnsseed=0

minimumchainwork=0

txindex=1

# --- May be useful for further experiments ---
# maxmempool=1000
# limitancestorcount=1000
# limitdescendantcount=1000
# limitancestorsize=10000
# limitdescendantsize=10000

# --- RPC queue ---
rpcworkqueue=64
rpcthreads=16

# REST API, required by mainnet-observer
rest=1
